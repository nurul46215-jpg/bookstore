<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pustaka Jaya Bookstore - Halaman Pesanan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f9f9f9;
            color: #333;
            line-height: 1.6;
        }
        header {
            background-color: #2c3e50;
            color: #ffffff;
            text-align: center;
            padding: 20px 10px 10px 10px;
        }
        header h1 {
            font-size: 2.5rem;
            letter-spacing: 1px;
        }
        
        /* CSS Baru untuk Navigation Bar */
        nav {
            background-color: #34495e;
            text-align: center;
            padding: 10px 0;
            margin-bottom: 20px;
        }
        nav a {
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            font-weight: bold;
            font-size: 1rem;
            transition: background 0.3s;
            border-radius: 4px;
            margin: 0 5px;
        }
        nav a:hover, nav a.active {
            background-color: #e74c3c;
        }

        main {
            max-width: 700px;
            margin: 30px auto;
            padding: 20px;
        }
        .order-card {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            padding: 30px;
            border: 1px solid #eee;
        }
        h2.page-title {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 25px;
            text-transform: uppercase;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 10px;
        }
        fieldset {
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 20px;
            margin-bottom: 25px;
        }
        legend {
            font-weight: bold;
            color: #2c3e50;
            padding: 0 10px;
            font-size: 1.1rem;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #4a5568;
        }
        .form-group input[type="text"],
        .form-group input[type="tel"],
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            font-size: 1rem;
        }
        .form-group textarea {
            resize: vertical;
            height: 80px;
        }
        .book-selection-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #f1f5f9;
        }
        .book-selection-item:last-child {
            border-bottom: none;
        }
        .book-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .book-info input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        .qty-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .qty-wrapper label {
            font-size: 0.9rem;
            color: #64748b;
        }
        .qty-wrapper input[type="number"] {
            width: 60px;
            padding: 6px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            text-align: center;
        }
        .payment-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .payment-option {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }
        .payment-option input[type="radio"] {
            width: 18px;
            height: 18px;
        }
        .btn-container {
            text-align: center;
            margin-top: 20px;
        }
        .btn-order {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 14px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s ease;
            text-transform: uppercase;
            box-shadow: 0 4px 6px rgba(231, 76, 60, 0.2);
        }
        .btn-order:hover {
            background-color: #c0392b;
        }
        footer {
            background-color: #2c3e50;
            color: #bdc3c7;
            text-align: center;
            padding: 20px 10px;
            margin-top: 50px;
            font-size: 0.9rem;
        }
        footer a {
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h1>PUSTAKA JAYA BOOKSTORE</h1>
    </header>

    <nav>
        <a href="index.html">Kanak-Kanak</a>
        <a href="menu.html">Horror</a>
        <a href="order.html" class="active">Borang Pesanan</a>
    </nav>

    <main>
        <div class="order-card">
            <h2 class="page-title">HALAMAN PESANAN</h2>

            <form action="#" method="POST">
                
                <fieldset>
                    <legend>MAKLUMAT PELANGGAN</legend>
                    
                    <div class="form-group">
                        <label for="nama">Nama Penuh:</label>
                        <input type="text" id="nama" name="nama" required>
                    </div>

                    <div class="form-group">
                        <label for="telefon">No Telefon:</label>
                        <input type="tel" id="telefon" name="telefon" required>
                    </div>

                    <div class="form-group">
                        <label for="alamat">Alamat:</label>
                        <textarea id="alamat" name="alamat" required></textarea>
                    </div>
                </fieldset>

                <fieldset>
                    <legend>PILIHAN BUKU</legend>
                    
                    <div class="book-selection-item">
                        <div class="book-info">
                            <input type="checkbox" id="book1" name="books[]" value="Sang Kancil">
                            <label for="book1">Sang Kancil (RM10.00)</label>
                        </div>
                        <div class="qty-wrapper">
                            <label for="qty1">KUANTITI</label>
                            <input type="number" id="qty1" name="qty[Sang Kancil]" min="1" value="1">
                        </div>
                    </div>

                    <div class="book-selection-item">
                        <div class="book-info">
                            <input type="checkbox" id="book2" name="books[]" value="Sang Arnab">
                            <label for="book2">Sang Arnab (RM15.00)</label>
                        </div>
                        <div class="qty-wrapper">
                            <label for="qty2">KUANTITI</label>
                            <input type="number" id="qty2" name="qty[Sang Arnab]" min="1" value="1">
                        </div>
                    </div>

                    <div class="book-selection-item">
                        <div class="book-info">
                            <input type="checkbox" id="book3" name="books[]" value="Sang Ular">
                            <label for="book3">Sang Ular (RM13.00)</label>
                        </div>
                        <div class="qty-wrapper">
                            <label for="qty3">KUANTITI</label>
                            <input type="number" id="qty3" name="qty[Sang Ular]" min="1" value="1">
                        </div>
                    </div>

                    <div class="book-selection-item">
                        <div class="book-info">
                            <input type="checkbox" id="book4" name="books[]" value="Ghost In The Cell">
                            <label for="book4">Ghost In The Cell (RM15.00)</label>
                        </div>
                        <div class="qty-wrapper">
                            <label for="qty4">KUANTITI</label>
                            <input type="number" id="qty4" name="qty[Ghost In The Cell]" min="1" value="1">
                        </div>
                    </div>
                </fieldset>

                <fieldset>
                    <legend>KAEDAH PEMBAYARAN</legend>
                    <div class="payment-group">
                        <label class="payment-option">
                            <input type="radio" name="pembayaran" value="FPX" checked>
                            Perbankan Internet (FPX)
                        </label>
                        <label class="payment-option">
                            <input type="radio" name="pembayaran" value="Kad">
                            Kad Kredit / Debit
                        </label>
                    </div>
                </fieldset>

                <div class="btn-container">
                    <button type="submit" class="btn-order">ORDER</button>
                </div>

            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 PUSTAKA JAYA BOOKSTORE. | HUBUNGI: <a href="tel:0134567891">013 4567891</a></p>
    </footer>

</body>
</html>
