<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pustaka Jaya Bookstore - Halaman Pesanan</title>
    
    <link rel="stylesheet" href="style.css">
</head>
<body class="body">

    <header>
        <h1>PUSTAKA JAYA BOOKSTORE</h1>
    </header>

    <nav>
        <a href="index.html">Kanak-Kanak</a>
        <a href="menu.html">Horror</a>
        <a href="order.html" class="active">Borang Pesanan</a>
    </nav>

    <main>
        <div class="order-card">
            <h2 class="page-title">HALAMAN PESANAN</h2>

            <form action="#" method="POST">
                
                <fieldset>
                    <legend>MAKLUMAT PELANGGAN</legend>
                    
                    <div class="form-group">
                        <label for="nama">Nama Penuh:</label>
                        <input type="text" id="nama" name="nama" required>
                    </div>

                    <div class="form-group">
                        <label for="telefon">No Telefon:</label>
                        <input type="tel" id="telefon" name="telefon" required>
                    </div>

                    <div class="form-group">
                        <label for="alamat">Alamat:</label>
                        <textarea id="alamat" name="alamat" required></textarea>
                    </div>
                </fieldset>

                <fieldset>
                    <legend>PILIHAN BUKU</legend>
                    
                    <div class="book-selection-item">
                        <div class="book-info">
                            <input type="checkbox" id="book1" name="books[]" value="Sang Kancil">
                            <label for="book1">Sang Kancil (RM10.00)</label>
                        </div>
                        <div class="qty-wrapper">
                            <label for="qty1">KUANTITI</label>
                            <input type="number" id="qty1" name="qty[Sang Kancil]" min="1" value="1">
                        </div>
                    </div>

                    <div class="book-selection-item">
                        <div class="book-info">
                            <input type="checkbox" id="book2" name="books[]" value="Sang Arnab">
                            <label for="book2">Sang Arnab (RM15.00)</label>
                        </div>
                        <div class="qty-wrapper">
                            <label for="qty2">KUANTITI</label>
                            <input type="number" id="qty2" name="qty[Sang Arnab]" min="1" value="1">
                        </div>
                    </div>

                    <div class="book-selection-item">
                        <div class="book-info">
                            <input type="checkbox" id="book3" name="books[]" value="Sang Ular">
                            <label for="book3">Sang Ular (RM13.00)</label>
                        </div>
                        <div class="qty-wrapper">
                            <label for="qty3">KUANTITI</label>
                            <input type="number" id="qty3" name="qty[Sang Ular]" min="1" value="1">
                        </div>
                    </div>

                    <div class="book-selection-item">
                        <div class="book-info">
                            <input type="checkbox" id="book4" name="books[]" value="Ghost In The Cell">
                            <label for="book4">Ghost In The Cell (RM15.00)</label>
                        </div>
                        <div class="qty-wrapper">
                            <label for="qty4">KUANTITI</label>
                            <input type="number" id="qty4" name="qty[Ghost In The Cell]" min="1" value="1">
                        </div>
                    </div>
                </fieldset>

                <fieldset>
                    <legend>KAEDAH PEMBAYARAN</legend>
                    <div class="payment-group">
                        <label class="payment-option">
                            <input type="radio" name="pembayaran" value="FPX" checked>
                            Perbankan Internet (FPX)
                        </label>
                        <label class="payment-option">
                            <input type="radio" name="pembayaran" value="Kad">
                            Kad Kredit / Debit
                        </label>
                    </div>
                </fieldset>

                <div class="btn-container">
                    <button type="submit" class="btn-order">ORDER</button>
                </div>

            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 PUSTAKA JAYA BOOKSTORE. | HUBUNGI: <a href="tel:0134567891">013 4567891</a></p>
    </footer>

</body>
</html>
