<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pustaka Jaya Bookstore - Buku Seram</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f9f9f9;
            color: #333;
            line-height: 1.6;
        }
        header {
            background-color: #2c3e50;
            color: #ffffff;
            text-align: center;
            padding: 20px 10px 10px 10px;
        }
        header h1 {
            font-size: 2.5rem;
            letter-spacing: 1px;
        }
        
        /* CSS Baru untuk Navigation Bar */
        nav {
            background-color: #34495e;
            text-align: center;
            padding: 10px 0;
            margin-bottom: 20px;
        }
        nav a {
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            font-weight: bold;
            font-size: 1rem;
            transition: background 0.3s;
            border-radius: 4px;
            margin: 0 5px;
        }
        nav a:hover, nav a.active {
            background-color: #e74c3c;
        }

        .promo-banner {
            background: linear-gradient(135deg, #e74c3c, #f39c12);
            color: white;
            text-align: center;
            padding: 40px 20px;
            margin: 20px auto;
            max-width: 1000px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .promo-banner h2 {
            font-size: 2rem;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        .promo-banner p {
            font-size: 1.5rem;
            font-weight: bold;
            background-color: rgba(255, 255, 255, 0.2);
            display: inline-block;
            padding: 5px 20px;
            border-radius: 20px;
        }
        main {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        .section-title {
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 30px;
            color: #2c3e50;
            border-bottom: 3px solid #2c3e50;
            padding-bottom: 10px;
        }
        .book-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }
        .book-card {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            padding: 20px;
            text-align: center;
            transition: transform 0.3s ease;
            border: 1px solid #eee;
        }
        .book-card:hover {
            transform: translateY(-5px);
        }
        .book-cover {
            width: 100%;
            height: 300px;         
            object-fit: contain;   
            background-color: #f5f5f5; 
            border-radius: 4px;
            margin-bottom: 15px;
        }
        .book-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 10px;
            color: #34495e;
            text-transform: uppercase;
        }
        .book-price {
            font-size: 1.3rem;
            color: #e74c3c;
            font-weight: bold;
        }
        footer {
            background-color: #2c3e50;
            color: #bdc3c7;
            text-align: center;
            padding: 20px 10px;
            margin-top: 40px;
            font-size: 0.9rem;
        }
        footer a {
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h1>PUSTAKA JAYA BOOKSTORE</h1>
    </header>

    <nav>
        <a href="index.html">Kanak-Kanak</a>
        <a href="menu.html" class="active">Horror</a>
        <a href="order.html">Borang Pesanan</a>
    </nav>

    <section class="promo-banner">
        <h2>BANNER PROMOSI: PESTA BUKU KEMBALI</h2>
        <p>DISKAUN SEHINGGA 50%</p>
    </section>

    <main>
        <h3 class="section-title">BESTSELLERS HORROR</h3>
        
        <div class="book-grid">
            <a href="page3.html" style="text-decoration: none; color: inherit;">
                <div class="book-card">
                    <img src="buku ghost.jpg" alt="Ghost In The Cell" class="book-cover">
                    <div class="book-title">GHOST IN THE CELL</div>
                    <div class="book-price">RM 15.00</div>
                </div>
            </a>

            <a href="page3.html" style="text-decoration: none; color: inherit;">
                <div class="book-card">
                    <img src="highland tower book.jpg" alt="Highland Tower" class="book-cover">
                    <div class="book-title">HIGHLAND TOWER</div>
                    <div class="book-price">RM 20.00</div>
                </div>
            </a>

            <a href="page3.html" style="text-decoration: none; color: inherit;">
                <div class="book-card">
                    <img src="asrama book.jpg" alt="Asrama" class="book-cover">
                    <div class="book-title">ASRAMA</div>
                    <div class="book-price">RM 10.00</div>
                </div>
            </a>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 PUSTAKA JAYA BOOKSTORE. | HUBUNGI: <a href="tel:0134567891">013 4567891</a></p>
    </footer>

</body>
</html>
